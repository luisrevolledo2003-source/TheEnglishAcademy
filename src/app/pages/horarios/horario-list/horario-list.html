<div class="container mt-4">
  <div class="d-flex justify-content-between mb-3">
    <h2>Horarios</h2>
    <a routerLink="/horarios/nuevo" class="btn btn-primary">+ Nuevo</a>
  </div>
  <table class="table table-striped">
    <thead class="table-dark">
      <tr><th>ID</th><th>Curso</th><th>Día</th><th>Inicio</th><th>Fin</th><th>Acciones</th></tr>
    </thead>
    <tbody>
      <tr *ngFor="let h of horarios">
        <td>{{ h.idHorario }}</td><td>{{ h.curso?.nombre }}</td><td>{{ h.dia }}</td><td>{{ h.horaInicio }}</td><td>{{ h.horaFin }}</td>
        <td>
          <a [routerLink]="['/horarios/editar', h.idHorario]" class="btn btn-sm btn-warning me-2">Editar</a>
          <button (click)="delete(h.idHorario!)" class="btn btn-sm btn-danger">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
