<div class="container mt-4">
  <div class="d-flex justify-content-between mb-3">
    <h2>Aulas</h2>
    <a routerLink="/aulas/nuevo" class="btn btn-primary">+ Nueva</a>
  </div>
  <table class="table table-striped">
    <thead class="table-dark">
      <tr><th>ID</th><th>Nombre</th><th>Capacidad</th><th>Acciones</th></tr>
    </thead>
    <tbody>
      <tr *ngFor="let a of aulas">
        <td>{{ a.idAula }}</td><td>{{ a.nombre }}</td><td>{{ a.capacidad }}</td>
        <td>
          <a [routerLink]="['/aulas/editar', a.idAula]" class="btn btn-sm btn-warning me-2">Editar</a>
          <button (click)="delete(a.idAula!)" class="btn btn-sm btn-danger">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
