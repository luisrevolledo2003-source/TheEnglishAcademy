<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Niveles</h2>
    <a routerLink="/niveles/nuevo" class="btn btn-primary">+ Nuevo nivel</a>
  </div>

  <table class="table table-striped">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Código</th>
        <th>Descripción</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let n of niveles">
        <td>{{ n.idNivel }}</td>
        <td>{{ n.codigo }}</td>
        <td>{{ n.descripcion }}</td>
        <td>
          <a [routerLink]="['/niveles/editar', n.idNivel]" class="btn btn-sm btn-warning me-2">Editar</a>
          <button (click)="deleteNivel(n.idNivel!)" class="btn btn-sm btn-danger">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
