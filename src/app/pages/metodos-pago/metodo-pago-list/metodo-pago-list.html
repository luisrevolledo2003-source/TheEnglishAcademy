<div class="container mt-4">
  <div class="d-flex justify-content-between mb-3">
    <h2>Métodos de Pago</h2>
    <a routerLink="/metodos-pago/nuevo" class="btn btn-primary">+ Nuevo</a>
  </div>
  <table class="table table-striped">
    <thead class="table-dark">
      <tr><th>ID</th><th>Nombre</th><th>Descripción</th><th>Acciones</th></tr>
    </thead>
    <tbody>
      <tr *ngFor="let m of metodos">
        <td>{{ m.idMetodoPago }}</td><td>{{ m.nombre }}</td><td>{{ m.descripcion }}</td>
        <td>
          <a [routerLink]="['/metodos-pago/editar', m.idMetodoPago]" class="btn btn-sm btn-warning me-2">Editar</a>
          <button (click)="delete(m.idMetodoPago!)" class="btn btn-sm btn-danger">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
