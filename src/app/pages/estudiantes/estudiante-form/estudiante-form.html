<div class="container mt-4">
  <div class="card shadow">
    <div class="card-header bg-primary text-white">
      <h3>{{ id ? 'Editar' : 'Nuevo' }} Estudiante</h3>
    </div>
    <div class="card-body">
      <form [formGroup]="form" (ngSubmit)="guardar()">
        <div class="mb-3">
          <label class="form-label">Nombre</label>
          <input type="text" class="form-control" formControlName="nombre" placeholder="Ingrese el nombre">
        </div>
        <div class="mb-3">
          <label class="form-label">Apellido</label>
          <input type="text" class="form-control" formControlName="apellido" placeholder="Ingrese el apellido">
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" formControlName="email" placeholder="Ingrese el email">
        </div>
        <div class="mb-3">
          <label class="form-label">Teléfono</label>
          <input type="text" class="form-control" formControlName="telefono" placeholder="Ingrese el teléfono">
        </div>
        <div class="mb-3">
          <label class="form-label">Fecha de Nacimiento</label>
          <input type="date" class="form-control" formControlName="fechaNacimiento">
        </div>
        <div class="mb-3">
          <label class="form-label">Nivel</label>
          <select class="form-select" formControlName="idNivel">
            <option [ngValue]="null">Seleccione un nivel</option>
            <option *ngFor="let n of niveles" [ngValue]="n.idNivel">{{ n.descripcion }} ({{ n.codigo }})</option>
          </select>
        </div>

        <div class="mt-4">
          <button type="submit" class="btn btn-success me-2" [disabled]="form.invalid">Guardar</button>
          <button type="button" class="btn btn-secondary" (click)="cerrar()">Cerrar</button>
        </div>
      </form>
    </div>
  </div>
</div>
