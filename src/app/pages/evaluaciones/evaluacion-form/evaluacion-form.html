<div class="container mt-4">
  <div class="card shadow">
    <div class="card-header bg-primary text-white"><h3>{{ id ? 'Editar' : 'Nueva' }} Evaluación</h3></div>
    <div class="card-body">
      <form [formGroup]="form" (ngSubmit)="save()">
        <div class="mb-3">
          <label class="form-label">Estudiante</label>
          <select class="form-select" formControlName="idEstudiante">
            <option *ngFor="let e of estudiantes" [ngValue]="e.idEstudiante">{{ e.nombre }} {{ e.apellido }}</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Nivel</label>
          <select class="form-select" formControlName="idNivel">
            <option *ngFor="let n of niveles" [ngValue]="n.idNivel">{{ n.descripcion }}</option>
          </select>
        </div>
        <div class="mb-3"><label class="form-label">Tipo</label><input type="text" class="form-control" formControlName="tipo" placeholder="Ej: Parcial, Final"></div>
        <div class="mb-3"><label class="form-label">Calificación</label><input type="number" step="0.1" class="form-control" formControlName="calificacion"></div>
        <div class="mb-3"><label class="form-label">Fecha</label><input type="date" class="form-control" formControlName="fecha"></div>
        <button type="submit" class="btn btn-success me-2" [disabled]="form.invalid">Guardar</button>
        <button type="button" class="btn btn-secondary" (click)="cerrar()">Cerrar</button>
      </form>
    </div>
  </div>
</div>
